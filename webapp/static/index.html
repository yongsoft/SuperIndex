<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperIndex</title>
<style>
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --surface-2:#F1EFE8; --border:rgba(0,0,0,.13);
  --border-soft:rgba(0,0,0,.07); --text:#2C2C2A; --text-2:#5F5E5A; --text-3:#888780;
  --accent:#185FA5; --accent-soft:#E6F1FB; --ok:#0F6E56; --ok-soft:#E1F5EE;
  --warn:#854F0B; --warn-soft:#FAEEDA; --err:#A32D2D; --err-soft:#FCEBEB;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1a19; --surface:#232322; --surface-2:#2C2C2A; --border:rgba(255,255,255,.16);
  --border-soft:rgba(255,255,255,.08); --text:#F1EFE8; --text-2:#B4B2A9; --text-3:#888780;
  --accent:#85B7EB; --accent-soft:#0C447C; --ok:#5DCAA5; --ok-soft:#085041;
  --warn:#EF9F27; --warn-soft:#633806; --err:#F09595; --err-soft:#501313;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:340px 1fr;height:100%}
aside{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.aside-hd{padding:16px 16px 12px;border-bottom:1px solid var(--border-soft)}
.aside-hd h1{font-size:15px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.aside-hd .meta{font-size:11px;color:var(--text-3);font-family:var(--mono)}
.corpora{flex:1;overflow-y:auto;padding:12px}
main{display:flex;flex-direction:column;min-height:0;min-width:0}
.btn{font:inherit;font-size:12px;padding:5px 11px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--text-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:11px;padding:3px 8px;border-radius:6px}
.card{border:1px solid var(--border-soft);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface)}
.card.on{border-color:var(--accent);background:var(--accent-soft)}
.card.missing{border-color:var(--err);background:var(--err-soft)}
.card-hd{display:flex;align-items:flex-start;gap:8px}
.card-hd input[type=checkbox]{margin:3px 0 0;flex:none;cursor:pointer}
.card-t{flex:1;min-width:0}
.card-name{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-path{font-size:11px;color:var(--text-3);font-family:var(--mono);word-break:break-all;margin-top:2px}
.badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:99px;font-weight:500;vertical-align:middle}
.badge.ready{background:var(--ok-soft);color:var(--ok)}
.badge.indexing{background:var(--warn-soft);color:var(--warn)}
.badge.pending{background:var(--surface-2);color:var(--text-2)}
.badge.error{background:var(--err-soft);color:var(--err)}
.stats{font-size:11px;color:var(--text-2);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 10px}
.acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.empty{color:var(--text-3);font-size:12px;text-align:center;padding:28px 12px;line-height:1.8}
.chat{flex:1;overflow-y:auto;padding:24px 28px;min-height:0}
.msg{margin-bottom:22px;max-width:820px}
.msg .who{font-size:11px;color:var(--text-3);margin-bottom:6px;font-family:var(--mono)}
.msg.user .body{background:var(--accent-soft);border-radius:12px;padding:10px 14px;display:inline-block}
.msg.bot .body{white-space:pre-wrap;word-wrap:break-word}
.trace{border-left:2px solid var(--border);margin:0 0 12px;padding:2px 0 2px 14px}
.trace summary{cursor:pointer;font-size:12px;color:var(--text-2);user-select:none}
.trace .step{font-size:12px;color:var(--text-2);margin-top:6px;font-family:var(--mono);line-height:1.7}
.trace .step b{color:var(--text);font-weight:500}
.trace .note{color:var(--warn)}
.sources{margin-top:14px;border-top:1px solid var(--border-soft);padding-top:10px}
.sources .src{font-size:12px;color:var(--text-2);font-family:var(--mono);margin:3px 0}
.stage{font-size:12px;color:var(--text-3);font-family:var(--mono);margin:6px 0}
.composer{border-top:1px solid var(--border);padding:14px 28px 18px;background:var(--surface)}
.composer-row{display:flex;gap:10px;align-items:flex-end;max-width:820px}
textarea{flex:1;font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);resize:none;min-height:44px;max-height:180px;line-height:1.5}
textarea:focus{outline:none;border-color:var(--accent)}
.scope{font-size:11px;color:var(--text-3);margin-top:8px;max-width:820px}
dialog{border:1px solid var(--border);border-radius:14px;padding:0;background:var(--surface);color:var(--text);
  width:min(640px,92vw);max-height:80vh}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg-hd{padding:14px 18px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center}
.dlg-hd h2{font-size:14px;font-weight:600;margin:0}
.dlg-body{padding:14px 18px;max-height:52vh;overflow-y:auto}
.dlg-ft{padding:12px 18px;border-top:1px solid var(--border-soft);display:flex;justify-content:space-between;
  align-items:center;gap:10px}
.crumb{font-family:var(--mono);font-size:12px;color:var(--text-2);word-break:break-all;flex:1}
.dirs{list-style:none;margin:10px 0 0;padding:0}
.dirs li{padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center}
.dirs li:hover{background:var(--surface-2)}
.dirs li .ico{color:var(--text-3);font-family:var(--mono);font-size:11px}
label.chk{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--text-2);cursor:pointer}
.err{color:var(--err);font-size:12px;margin-top:6px}
.hint{font-size:12px;color:var(--text-2);background:var(--surface-2);border-radius:8px;padding:9px 11px;line-height:1.65}
.hint code{font-family:var(--mono);font-size:11px;background:var(--surface);padding:1px 5px;border-radius:4px}
.hint strong{font-weight:500;color:var(--text)}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="aside-hd">
      <h1>SuperIndex</h1>
      <div class="meta" id="meta">加载中…</div>
    </div>
    <div class="corpora" id="corpora"></div>
    <div style="padding:12px;border-top:1px solid var(--border-soft)">
      <button class="btn primary" id="addBtn" style="width:100%">+ 添加目录</button>
    </div>
  </aside>

  <main>
    <div class="chat" id="chat">
      <div class="empty">
        左侧添加一个目录，系统会自动建立索引。<br>
        索引完成的目录会自动进入提问范围，也可以只勾选部分目录。<br>
        目录内的文件变化会被自动检测并更新描述。
      </div>
    </div>
    <div class="composer">
      <div class="composer-row">
        <textarea id="q" rows="1" placeholder="就选中的目录提问…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="btn primary" id="send" disabled>发送</button>
      </div>
      <div class="scope" id="scope">尚未选择范围</div>
    </div>
  </main>
</div>

<dialog id="dlg">
  <div class="dlg-hd">
    <h2>选择要索引的目录</h2>
    <button class="btn sm" id="dlgClose">关闭</button>
  </div>
  <div class="dlg-body">
    <div class="hint">
      把目录放进 <code id="dataRootLabel">data/</code> 就会自动被索引，不用在这里操作。
      下面的浏览器用于注册 <strong>data/ 之外</strong>的目录。
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
      <button class="btn sm" id="upBtn">↑ 上级</button>
      <span class="crumb" id="crumb">/</span>
    </div>
    <ul class="dirs" id="dirs"></ul>
    <div class="err" id="dlgErr"></div>
  </div>
  <div class="dlg-ft">
    <label class="chk"><input type="checkbox" id="deep"> 深度索引（同时生成章节摘要，成本更高）</label>
    <div style="display:flex;gap:8px">
      <input id="alias" placeholder="显示名称（可选）" style="font:inherit;font-size:12px;padding:5px 9px;
        border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);width:150px">
      <button class="btn primary" id="useBtn">索引此目录</button>
    </div>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
let STATE = {corpora: []};
let CURRENT = null;
let BROWSE_PATH = null;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Answers arrive as Markdown. Escape first, then apply only the two inline
// forms worth rendering — bold and code. Anything richer would mean injecting
// model output as HTML, which is not worth the risk here.
const mdInline = s => esc(s)
  .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
  .replace(/`([^`\n]+)`/g, '<code>$1</code>');

const nameOf = id => (STATE.corpora.find(c => c.id === id) || {}).name || id;

// 把 "8828b4a6/友邦保险/2024/x.md" 显示成 "测试语料 A / 友邦保险/2024/x.md"
function pretty(rel){
  const i = rel.indexOf('/');
  if (i < 0) return rel;
  return nameOf(rel.slice(0, i)) + ' / ' + rel.slice(i + 1);
}
function fmtTime(t){ return t ? new Date(t * 1000).toLocaleString('zh-CN', {hour12:false}) : '—'; }

// ── 状态轮询 ────────────────────────────────────────────────────────────
async function loadState(){
  try{
    const r = await fetch('/api/state');
    STATE = await r.json();
  }catch(e){ return; }
  renderMeta(); renderCorpora(); renderScope();
}

function renderMeta(){
  if (STATE.data_root){
    const el = $('#dataRootLabel');
    if (el){
      // 显示成相对项目根的短路径，太长就只留目录名
      const parts = STATE.data_root.split('/').filter(Boolean);
      el.textContent = (parts[parts.length - 1] || 'data') + '/';
      el.title = STATE.data_root;
    }
  }
  const ready = STATE.corpora.filter(c => c.ready).length;
  $('#meta').textContent =
    `${STATE.corpora.length} 个目录 · ${ready} 就绪 · ${STATE.watching ? '监控中' : '未监控'}\n${STATE.chat_model}`;
}

function renderCorpora(){
  const box = $('#corpora');
  if (!STATE.corpora.length){
    box.innerHTML = '<div class="empty">还没有注册目录<br>点击下方「添加目录」开始</div>';
    return;
  }
  box.innerHTML = STATE.corpora.map(c => {
    const ch = c.changes || {};
    const nch = (ch.added?.length || 0) + (ch.changed?.length || 0) + (ch.removed?.length || 0);
    const busy = c.status === 'indexing' || (STATE.busy || []).includes(c.id);
    return `
    <div class="card ${c.ready ? 'on' : ''} ${c.missing ? 'missing' : ''}" data-id="${c.id}">
      <div class="card-hd">
        <input type="checkbox" data-sel="${c.id}" ${c.ready ? 'checked' : 'disabled'}>
        <div class="card-t">
          <div class="card-name">${esc(c.name)}${
            STATE.data_root && c.path.startsWith(STATE.data_root)
              ? ' <span class="badge pending" style="margin-left:2px">data</span>' : ''}</div>
          <div class="card-path">${esc(c.path)}</div>
        </div>
      </div>
      <div style="margin-top:7px">
        <span class="badge ${c.status}">${c.status}</span>
        ${c.deep_index ? '<span class="badge pending" style="margin-left:4px">深度</span>' : ''}
        ${nch && c.ready ? `<span class="badge indexing" style="margin-left:4px">待更新 ${nch}</span>` : ''}
      </div>
      ${c.stage ? `<div class="stats">${esc(c.stage)}</div>` : ''}
      ${c.error ? `<div class="err">${esc(c.error)}</div>` : ''}
      ${c.ready ? `<div class="stats">
        <span>${c.n_files} 文件</span><span>${c.n_dirs} 目录</span>
        <span>${c.n_chapters} 章节</span><span>${c.n_summarized} 有描述</span></div>` : ''}
      ${c.indexed_at ? `<div class="stats"><span>索引于 ${fmtTime(c.indexed_at)}</span></div>` : ''}
      <div class="acts">
        <button class="btn sm" data-act="reindex" data-id="${c.id}" ${busy ? 'disabled' : ''}>
          ${busy ? '索引中…' : '重建索引'}</button>
        <button class="btn sm" data-act="rename" data-id="${c.id}">改名</button>
        <button class="btn sm" data-act="remove" data-id="${c.id}">移除</button>
      </div>
    </div>`;
  }).join('');
}

function renderScope(){
  const sel = selected();
  const ready = STATE.corpora.filter(c => c.ready);
  if (!ready.length){ $('#scope').textContent = '还没有可用的索引'; $('#send').disabled = true; return; }
  $('#scope').textContent = sel.length
    ? `范围：${sel.map(nameOf).join('、')}（${sel.length}/${ready.length}）`
    : `范围：全部 ${ready.length} 个已索引目录`;
  $('#send').disabled = false;
}
const selected = () => [...document.querySelectorAll('[data-sel]:checked')].map(e => e.dataset.sel);

// ── 目录操作 ────────────────────────────────────────────────────────────
$('#corpora').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const {act, id} = b.dataset;
  if (act === 'remove'){
    if (!confirm('移除该目录并删除它的索引？')) return;
    await fetch(`/api/corpora/${id}`, {method:'DELETE'});
  } else if (act === 'reindex'){
    await fetch(`/api/corpora/${id}/reindex`, {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({})});
  } else if (act === 'rename'){
    const n = prompt('新的显示名称', nameOf(id));
    if (!n) return;
    await fetch(`/api/corpora/${id}`, {method:'PATCH',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({name:n})});
  }
  loadState();
});
$('#corpora').addEventListener('change', e => { if (e.target.dataset.sel) renderScope(); });

// ── 目录浏览器 ──────────────────────────────────────────────────────────
$('#addBtn').onclick = () => { $('#dlg').showModal(); browse(BROWSE_PATH || STATE.home || '/'); };
$('#dlgClose').onclick = () => $('#dlg').close();
$('#upBtn').onclick = () => { if (CURRENT?.parent) browse(CURRENT.parent); };

async function browse(path){
  $('#dlgErr').textContent = '';
  const r = await fetch('/api/browse?path=' + encodeURIComponent(path));
  const d = await r.json();
  CURRENT = d; BROWSE_PATH = d.path;
  if (d.error){ $('#dlgErr').textContent = d.error; }
  $('#crumb').textContent = d.path;
  $('#upBtn').disabled = !d.parent;
  $('#dirs').innerHTML = (d.dirs || []).map(x =>
    `<li data-path="${esc(x.path)}"><span class="ico">▸</span>${esc(x.name)}</li>`).join('')
    || '<li style="cursor:default;color:var(--text-3)">（没有子目录）</li>';
}
$('#dirs').addEventListener('click', e => {
  const li = e.target.closest('li[data-path]');
  if (li) browse(li.dataset.path);
});
$('#useBtn').onclick = async () => {
  if (!CURRENT?.path) return;
  const body = {path: CURRENT.path, name: $('#alias').value.trim(),
                deep_index: $('#deep').checked};
  const r = await fetch('/api/corpora', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const d = await r.json();
  if (d.error){ $('#dlgErr').textContent = d.error; return; }
  $('#dlg').close(); $('#alias').value = '';
  loadState();
};

// ── 提问（POST + SSE）──────────────────────────────────────────────────
function addMsg(cls, html){
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = html;
  $('#chat').appendChild(div);
  $('#chat').scrollTop = $('#chat').scrollHeight;
  return div;
}

function stepLine(n){
  const picked = (n.picked || []).map(p => pretty(p)).join('、') || '—';
  const where = n.level === 'dir' ? pretty(n.where) : pretty(n.where);
  const label = n.level === 'dir' ? '目录' : '章节';
  return `<div class="step">[${label}] ${esc(where)}<br>&nbsp;&nbsp;→ <b>${esc(picked)}</b>`
    + (n.note ? ` <span class="note">(${esc(n.note)})</span>` : '') + '</div>';
}

async function ask(){
  const question = $('#q').value.trim();
  if (!question) return;
  $('#q').value = ''; $('#q').style.height = 'auto';
  $('#chat').querySelector('.empty')?.remove();

  addMsg('user', `<div class="who">你</div><div class="body">${esc(question)}</div>`);
  const bot = addMsg('bot', `<div class="who">SuperIndex</div>
    <details class="trace" open><summary>检索路径</summary><div class="steps"></div></details>
    <div class="stage">准备中…</div><div class="body"></div><div class="sources"></div>`);
  const steps = bot.querySelector('.steps'), stage = bot.querySelector('.stage'),
        body = bot.querySelector('.body'), srcs = bot.querySelector('.sources');

  $('#send').disabled = true;
  try{
    const r = await fetch('/api/ask', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question, corpus_ids: selected()})});
    if (!r.ok){ const e = await r.json(); throw new Error(e.error || r.statusText); }

    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', acc = '';
    while (true){
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const raw of parts){
        const ev = (raw.match(/^event: (.+)$/m) || [])[1];
        const dt = (raw.match(/^data: (.+)$/m) || [])[1];
        if (!ev || dt === undefined) continue;
        let d; try{ d = JSON.parse(dt); }catch{ continue; }
        if (ev === 'stage') stage.textContent = d.text;
        else if (ev === 'nav') steps.insertAdjacentHTML('beforeend', stepLine(d));
        else if (ev === 'sources'){
          srcs.innerHTML = '<div class="who" style="margin-bottom:4px">来源</div>' +
            d.map(s => `<div class="src">${esc(pretty(s.file))} § ${esc(s.title)} (${s.start}-${s.end})</div>`).join('');
        }
        else if (ev === 'answer'){ stage.textContent = ''; acc += d.delta; body.innerHTML = mdInline(acc); }
        else if (ev === 'error'){ stage.textContent = ''; body.innerHTML += `<div class="err">${esc(d.message)}</div>`; }
        else if (ev === 'done'){ stage.textContent = d.ok ? `完成 · ${d.ms} ms` : '未完成'; }
      }
      $('#chat').scrollTop = $('#chat').scrollHeight;
    }
  }catch(e){
    stage.textContent = '';
    body.innerHTML += `<div class="err">${esc(e.message)}</div>`;
  }
  $('#send').disabled = false;
}

$('#send').onclick = ask;
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(); }
});
$('#q').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 180) + 'px';
});

loadState();
setInterval(loadState, 3000);

// Deep link: /?q=<question> asks on load, so a question can be shared or
// bookmarked. Also what makes the flow testable from a headless browser.
const initialQ = new URLSearchParams(location.search).get('q');
if (initialQ){
  $('#q').value = initialQ;
  setTimeout(() => ask(), 400);      // let the first /api/state land
}
</script>
</body>
</html>
